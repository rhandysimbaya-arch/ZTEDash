plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rhandy.ztedash'
    compileSdk 34

    defaultConfig {
        applicationId "com.rhandy.ztedash"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Fixed signing key so every build installs as an update over the previous one.
    signingConfigs {
        shared {
            storeFile file('ztedash.jks')
            storePassword 'ztedash123'
            keyAlias 'ztedash'
            keyPassword 'ztedash123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
